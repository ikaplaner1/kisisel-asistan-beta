name: Mac imza ve acilis dogrulamasi
# Kaynak: depo kokundeki Mac-Derleme-Kaynagi-<surum>.zip (MacKaynakPaketiniHazirla.ps1 uretir).
# Once Windows surumu ayni numarayla yayinlanmis olmali; Mac paketleri o yayina eklenir.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Surum (Windows yayiniyla ayni, or. 1.0.1-beta-5)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: mac-beta-release
  cancel-in-progress: false
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Incelenmis kaynaklari ac
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in *[!A-Za-z0-9.-]*|'') echo "Gecersiz surum"; exit 1;; esac
          unzip -q "Mac-Derleme-Kaynagi-$VERSION.zip" 'outputs/*' -d .
          test "$(node -p "require('./outputs/KisiselAsistan.Mac/package.json').version")" = "$VERSION"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Bagimliliklari kur
        working-directory: outputs/KisiselAsistan.Mac
        run: npm ci
      - name: Imzali Mac paketini olustur
        working-directory: outputs/KisiselAsistan.Mac
        env:
          ASSISTANT_GITHUB_CLIENT_ID: Iv23liM1yilkR8XUb1XI
        run: node build.mjs --${{ matrix.arch }}
      - name: DMG ve ZIP imzalarini ve gercek acilisi test et
        working-directory: outputs/KisiselAsistan.Mac
        run: node verify-release.mjs --${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mac-test-${{ matrix.arch }}
          path: outputs/KisiselAsistan.Mac/verification/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Mac-package-${{ matrix.arch }}
          path: |
            outputs/KisiselAsistan.Mac/distribution/${{ matrix.arch }}/*.dmg
            outputs/KisiselAsistan.Mac/distribution/${{ matrix.arch }}/*.zip
          if-no-files-found: error
  release:
    needs: mac
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Mac-package-*
          merge-multiple: true
          path: packages
      - name: Dogrulanmis Mac paketlerini Windows yayinina ekle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ inputs.version }}
        run: |
          cd packages
          test "$(find . -maxdepth 1 -name '*.dmg' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 2
          gh release view "$TAG" > /dev/null || { echo "Once $TAG Windows surumunu yayinla."; exit 1; }
          sha256sum *.dmg *.zip > SHA256SUMS-mac.txt
          gh release upload "$TAG" *.dmg *.zip SHA256SUMS-mac.txt --clobber
          mkdir downloaded
          gh release download "$TAG" --dir downloaded --pattern '*.dmg' --pattern '*-mac-*.zip' --pattern SHA256SUMS-mac.txt
          cd downloaded
          sha256sum --check SHA256SUMS-mac.txt
